# /etc/nginx/sites-enabled/ui.conf en el VPS (comportarte.com).
#
# Igual que antes (TLS de Certbot, redirecciones, todo lo demás por proxy a
# Node en el puerto 3000) más una cosa: los assets con hash (/assets/) los
# entrega nginx directo desde /var/www/comportarte-ui, ya precomprimidos
# (.br y .gz del build: brotli_static y gzip_static), sin pasar por Node.
# La carpeta la llena scripts/deploy-production.sh (publish_assets); si
# falta un archivo, se pide a Node como antes.
#
# Brotli requiere los módulos de Ubuntu:
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#
# HTTP/2 está activado para todo el servidor en /etc/nginx/conf.d/http2.conf
# (`http2 on;`), no en `listen ... http2` (obsoleto desde nginx 1.25, y
# aplicaba al puerto completo de todos modos).

# 1. BLOQUE PRINCIPAL (HTTPS sin www)
server {
    server_name comportarte.com;

    # Assets con hash: nginx directo, caché de 1 año.
    location /assets/ {
        root /var/www/comportarte-ui;
        # Source maps: privados (se suben a OpenObserve en el deploy). Los
        # .br/.gz solo se entregan como Content-Encoding.
        location ~* \.(?:map|gz|br)$ {
            return 404;
        }
        # Precomprimidos por el build: brotli a quien lo acepta (~14 % menos
        # que gzip), gzip a los demás. Requiere libnginx-mod-http-brotli-*.
        brotli_static on;
        gzip_static on;
        # Respaldo si algún archivo no trae su .br/.gz.
        brotli on;
        brotli_comp_level 5;
        brotli_min_length 1024;
        brotli_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri @ui;
    }

    # Lo que no esté en la carpeta pública (p. ej. antes del primer deploy).
    location @ui {
        proxy_pass             http://127.0.0.1:3000;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
    }

    location / {
        proxy_pass             http://127.0.0.1:3000;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection 'upgrade';
        proxy_set_header       Host $host;
        proxy_cache_bypass     $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/comportarte.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/comportarte.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. REDIRECCIÓN DE HTTPS WWW A HTTPS SIN WWW
server {
    listen 443 ssl;
    server_name www.comportarte.com;

    ssl_certificate /etc/letsencrypt/live/comportarte.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comportarte.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://comportarte.com$request_uri;
}

# 3. REDIRECCIÓN GENERAL DE HTTP (PUERTO 80) A HTTPS
server {
    listen 80;
    server_name comportarte.com www.comportarte.com;

    return 301 https://comportarte.com$request_uri;
}
